packages:
  - packages/*
  - fixtures/*
  - examples/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
overrides:
  sizuku: link:packages/sizuku
  # @heroui/react reaches these types packages; their newer releases pull in Adobe's Spectrum
  # design system (thousands of icon files) for declarations erased at build time.
  # hono-takibi pins effect and @effect/platform-node to 4.0.0, whose platform-node-shared floats
  # to a release that imports what effect 4.0.0 lacks; hold it to the one it ships with.
  "@effect/platform-node@4.0.0>@effect/platform-node-shared": 4.0.0
  "@react-types/color": 3.1.4
  "@react-types/slider": 3.8.4
